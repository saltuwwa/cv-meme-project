# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qazaq-meme-vision
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements_deploy.txt
    startCommand: uvicorn backend.main_deploy:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
